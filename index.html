<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noam Fit</title>
<meta name="theme-color" content="#0c1513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noam Fit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling view, bottom tab bar; workout mode is a full-screen layer with the main action in the thumb zone */
:root{
  --bg:#0c1513; --surface:#13201d; --surface2:#1a2b27; --line:#24413b;
  --fg:#e7f3f0; --muted:#8fa9a3; --accent:#2eb5a5; --accent-ink:#06211d;
  --warn:#f2b84b; --bad:#ef6f6c; --good:#5fd38d;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f7f6; --surface:#ffffff; --surface2:#e8f0ee; --line:#cfdeda;
  --fg:#0f1f1c; --muted:#5a726d; --accent:#14897c; --accent-ink:#ffffff;
  --warn:#a86a00; --bad:#c2403c; --good:#1f8a4c; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f7f6; --surface:#ffffff; --surface2:#e8f0ee; --line:#cfdeda;
  --fg:#0f1f1c; --muted:#5a726d; --accent:#14897c; --accent-ink:#ffffff;
  --warn:#a86a00; --bad:#c2403c; --good:#1f8a4c; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 112px}

header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.3px}
.brand b{color:var(--accent);font-weight:400}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.local{background:var(--warn)}

h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:18px 0 4px;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}
.sub{color:var(--muted);margin:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.up{color:var(--good)} .pill.down{color:var(--warn)} .pill.pr{background:var(--accent);color:var(--accent-ink);font-weight:700}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;padding:0 18px;font-weight:700;font-size:17px;background:var(--surface2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{min-height:64px;font-size:20px;border-radius:18px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:40px;font-size:15px;padding:0 12px;border-radius:12px}
.btn:disabled{opacity:.45}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:grid;place-items:center;gap:2px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.wd .l{font-weight:800;font-size:15px}
.wd .s{width:6px;height:6px;border-radius:50%;background:transparent}
.wd.done .s{background:var(--good)}
.wd.today{border-color:var(--accent)}
.wd[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wd.rest .l{opacity:.6}

/* exercise list */
.ex{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:right;width:100%}
.ex .th{width:56px;height:56px;border-radius:10px;background:var(--surface2) center/cover no-repeat;display:grid;place-items:center;font-family:var(--f-display);color:var(--accent);font-size:20px}
.ex .nm{font-weight:700;font-size:16px;line-height:1.2}
.ex .meta{font-size:13px;color:var(--muted)}
.ex .rec{font-size:13px;text-align:left;white-space:nowrap}
.ex .rec b{display:block;font-family:var(--f-num);font-size:15px;color:var(--accent)}
.min0{min-width:0}

.shoulder{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.banner{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--fg);font-size:14px;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}

.check{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:right}
.check:last-child{border-bottom:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px}
.check[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check[aria-checked="true"] span{color:var(--muted);text-decoration:line-through}

/* tab bar */
nav.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{min-height:60px;display:grid;place-items:center;font-size:13px;color:var(--muted);gap:2px;padding-top:6px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* workout layer */
#wk{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.wk-top{padding:10px 16px 6px;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;width:100%}
.wk-prog{display:flex;gap:4px;flex:1}
.wk-prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.wk-prog i.d{background:var(--accent)} .wk-prog i.c{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wk-body{flex:1;overflow-y:auto;padding-inline:16px;padding-block:4px 16px;max-width:560px;margin:0 auto;width:100%}
.wk-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);}
.wk-foot .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--surface2);aspect-ratio:16/8;max-width:100%;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:relative;width:100%;padding:12px;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0));color:#fff}
.hero .ov h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.hero .how{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.hero.noimg{aspect-ratio:auto;min-height:96px;background:linear-gradient(135deg,var(--surface2),var(--surface))}
.hero.noimg .ov{background:none;color:var(--fg)}
.hero.noimg .how{background:var(--accent);color:var(--accent-ink)}

.target{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.target div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.target small{display:block;font-size:12px;color:var(--muted)}
.target b{font-family:var(--f-num);font-size:17px}
.why{font-size:14px;color:var(--muted);margin:8px 2px 0}
.why b{color:var(--fg)}

.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.stp label{display:block;text-align:center;font-size:13px;color:var(--muted)}
.stp .ctl{display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.stp .ctl button{height:56px;border-radius:12px;background:var(--surface2);font-size:28px;font-weight:700;line-height:1}
.stp input{width:100%;text-align:center;background:transparent;border:0;font-family:var(--f-num);font-size:36px;font-weight:600;padding:0;min-width:0}
.bands{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rir{margin-top:10px}
.rir .chips{flex-wrap:nowrap}
.rir .chip{flex:1;justify-content:center;padding-inline:4px}

.sets{display:grid;gap:6px;margin-top:12px}
.set{display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.set .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px}
.set.todo{border-style:dashed;color:var(--muted)}
.set.todo .n{background:var(--surface2);color:var(--muted)}
.set .x{color:var(--muted);font-size:20px;width:36px;height:36px}

/* rest overlay */
#rest{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px}
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:64px;font-weight:600}
.rest-next{text-align:center;max-width:340px}
.rest-next b{display:block;font-size:20px}
.rest-actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;width:min(100%,420px)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.5)}
#sheet .pane{background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;width:100%;margin:0 auto}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
#sheet img{width:100%;border-radius:14px;display:block}
#sheet h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:12px 0 0}
#sheet ul{padding-inline-start:20px;margin:6px 0}
#sheet li{margin:4px 0}
.k{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:14px}

/* progress */
.bar{display:grid;grid-template-columns:72px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.track{position:relative;height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.track .fill{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:6px;background:var(--accent)}
.track .fill.plan{background:color-mix(in srgb,var(--accent) 35%,transparent)}
canvas.chart{width:100%;height:170px;display:block}
.hist{display:grid;gap:8px}
.hrow{width:100%;text-align:right;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.hrow .d{font-weight:700}
.hdet{grid-column:1/-1;font-size:14px;color:var(--muted);display:grid;gap:2px;margin-top:6px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:20px}
.stat small{color:var(--muted);font-size:12px}
.scrollx{overflow-x:auto;display:flex;gap:8px;padding-bottom:4px;scrollbar-width:none}
.scrollx .chip{flex:none}
#login{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
#login .pane{width:min(100%,400px);display:grid;gap:12px}
.inp{width:100%;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:18px}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;margin:0 auto;max-width:420px;background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:14px;font-weight:600;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.confirm{display:flex;gap:8px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .25s linear}}
</style>
<style>html,body{margin:0;padding:0}</style>
</head>
<body>


<header class="top"><div class="in">
  <div class="brand">Noam <b>Fit</b></div>
  <div class="sync" id="sync" role="button" tabindex="0" data-act="login"><span class="dot"></span><span>טוען…</span></div>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="ניווט"><div class="in">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>היום</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>תוכנית</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>התקדמות</button>
</div></nav>

<div id="wk" hidden></div>
<div id="rest" hidden></div>
<div id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<div id="login" hidden></div>

const snapKg = x => DBW.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a);
const stepKg = (x,dir) => { const i=DBW.indexOf(snapKg(x)); return DBW[Math.max(0,Math.min(DBW.length-1,i+dir))]; };
const r25 = snapKg;
const fmtKg = x => (+x%1===0? +x : (+x).toFixed(1));

const dstr = (iso,opt) => new Date(iso).toLocaleDateString("he-IL",opt||{day:"numeric",month:"numeric"});
const weekStart = (d=new Date()) => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; };
const unitOf = ex => ex.type==="time" ? "ש׳" : "חז׳";
function toast(msg,ms=2200){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,ms); }

async function flush(){
  if(!sb||!store.user||store.busy||!navigator.onLine) return;
  store.busy=true; store.err=false;
  try{
    for(const id of Object.keys(store.outbox)){

      if(store.outbox[id]===data){ delete store.outbox[id]; lsSet("nf.outbox",store.outbox); }

async function pull(){
  if(!sb||!store.user||!navigator.onLine) return;
  const {data,error}=await sb.from("fit_docs").select("id,data");
  if(error){ store.err=true; setSync(); return; }
  const pend=store.outbox, ws=[]; let body=null, act=null, prot=null;
  data.forEach(({id,data:v})=>{ if(id in pend) return;
    if(id==="protein") prot=v.days||{}; else if(id==="body") body=v.entries;
    else if(id==="rehab"){ S.rehab=v; lsSet("nf.rehab",v); }
    else if(id.startsWith("w_")){ if(v.status==="done") ws.push(v); else act=v; } });
  // keep local-only and pending items
  const ids=new Set(ws.map(w=>w.id));
  S.history.forEach(w=>{ if(!ids.has(w.id)){ ws.push(w); if(!store.pulled) saveWorkout(w); } });
  Object.entries(pend).forEach(([id,v])=>{ if(id.startsWith("w_")&&v===null){ const i=ws.findIndex(w=>w.id===id); if(i>=0) ws.splice(i,1);} });
  S.history = ws.filter(w=>w.status==="done").sort((a,b)=>a.start.localeCompare(b.start));
  if(body) S.body = mergeBody(body); else if(!store.pulled) saveBody();
  if(prot){ const t=dkey(); S.prot={...prot}; } else if(!store.pulled && Object.keys(S.prot).length) saveProt();
  if(!S.active && act && Date.now()-new Date(act.start).getTime()<6*3600e3) S.active={...act,open:false};
  if(S.active && S.history.some(w=>w.id===S.active.id)) S.active=null;
  store.pulled=true; persistLocal(); lsSet("nf.prot",S.prot); setSync(); render(); flush();
}

/* ---------- Training logic ---------- */
function lastSessions(exId,n=10){
  const out=[];
  for(let i=S.history.length-1;i>=0&&out.length<n;i--){
    const it=S.history[i].items.find(x=>x.id===exId && x.sets.length);
    if(it) out.push({date:S.history[i].start,sets:it.sets});
  }
  return out;
}
const e1rm = s => s.kg ? s.kg*(1+s.reps/30) : s.reps;
function shLevel(){ const t = S.shoulder.date===new Date().toDateString() ? S.shoulder.level : null; return rehabPhase()===3 ? Math.max(1, t??0) : t; }
function shoulderSore(){ return shLevel()>=2; }
function resolveEx(id){ const ex=EX[id]; if(shLevel()>=1 && ex.alt) return ex.alt; return id; }

function recommend(id, plan){
  const ex=EX[id], hist=lastSessions(id,2), last=hist[0];
  let r={kg:null,band:null,reps:plan.lo,why:""};
  if(ex.type==="band") r.band = last ? (last.sets.at(-1).band||BANDS[1]) : (id==="pullApart"?BANDS[2]:id==="extRot"||id==="bandFly"?BANDS[0]:BANDS[1]);
  if(!last){
    if(ex.type==="db"){ const b=BASE[id]; r.kg=snapKg(b?b.kg:8); r.why = b&&!b.est ? "נקודת פתיחה מהנתונים האחרונים שלך" : "הערכה. כייל בסט הראשון: אמור להישאר 1–2 חזרות ברזרבה"; }
    else r.why="סט ראשון: עצור כשנשארות 1–2 חזרות ברזרבה";
    return sore(r,ex);
  }
  const reps=last.sets.map(s=>s.reps), minR=Math.min(...reps);
  const lastKg=Math.max(...last.sets.map(s=>s.kg||0));
  const allTop = last.sets.length>=plan.sets && reps.every(x=>x>=plan.hi);
  const below = reps.filter(x=>x<plan.lo).length >= Math.ceil(last.sets.length/2);
  const prevBelow = hist[1] && hist[1].sets.filter(s=>s.reps<plan.lo).length >= Math.ceil(hist[1].sets.length/2);
  if(ex.type==="db"){
    r.kg=snapKg(lastKg);
    if(allTop && r.kg<MAXW){ r.kg=stepKg(r.kg,1); r.reps=plan.lo; r.why=`<b>משקולת הבאה: ${fmtKg(r.kg)} ק״ג.</b> כל הסטים הגיעו ל־${plan.hi}. התחל שוב מ־${plan.lo} חזרות`; }
    else if(below && prevBelow){ r.kg=stepKg(r.kg,-1); r.reps=plan.lo; r.why=`<b>משקולת קודמת: ${fmtKg(r.kg)} ק״ג.</b> שני אימונים מתחת לטווח. בונים מחדש`; }
    else if(below){ r.reps=plan.lo; r.why=`<b>אותו משקל.</b> מטרה: ${plan.lo} חזרות בכל הסטים`; }
    else { r.reps=Math.min(plan.hi,minR+1); r.why=`<b>אותו משקל, +1 חזרה</b> בסט החלש (היה ${minR})`; }
    if(allTop && snapKg(lastKg)>=MAXW){ r.why="<b>הגעת ל־24 ק״ג.</b> הוסף סט, או האט ירידה ל־4 שניות"; r.reps=plan.hi; }
  } else if(ex.type==="band"){
    r.reps=Math.min(plan.hi,minR+1);
    r.why = allTop ? "<b>הגעת לתקרה.</b> עבור לגומייה קשה יותר או צעד רחוק יותר מהעוגן" : `<b>אותה גומייה, +1 חזרה</b> (היה ${minR})`;
  } else {
    r.reps = allTop ? plan.hi+ (ex.type==="time"?5:1) : Math.min(plan.hi,minR+(ex.type==="time"?5:1));
    r.why = allTop ? "<b>מעל הטווח.</b> האט את הקצב או הוסף משקל" : `<b>יעד: ${r.reps}</b> (בפעם הקודמת ${minR})`;
  }
  return sore(r,ex);
}
function sore(r,ex){
  if(shLevel()>=1 && ex.risky && ex.shoulder){ if(shoulderSore() && r.kg) r.kg=stepKg(r.kg,-1); r.why += ` · <b>כתף:</b> ${ex.shoulder}`; }
  return r;
}
function lastSummary(id){
  const l=lastSessions(id,1)[0]; if(!l) return "—";
  const ex=EX[id];
  if(ex.type==="db"){ const kg=Math.max(...l.sets.map(s=>s.kg)); return `${fmtKg(kg)}×${l.sets.map(s=>s.reps).join(",")}`; }
  return l.sets.map(s=>s.reps).join(",")+" "+unitOf(ex);
}
function trend(id){
  const h=lastSessions(id,3); if(h.length<2) return "";
  const best=x=>Math.max(...x.sets.map(e1rm));
  const a=best(h[h.length-1]), b=best(h[0]);
  if(b>a*1.03) return `<span class="pill up">↗ עולה</span>`;
  if(b<a*0.97) return `<span class="pill down">↘ יורד</span>`;
  return `<span class="pill">→ יציב</span>`;
}
function weekDoneDays(){
  const ws=weekStart(); const set=new Set();
  S.history.forEach(w=>{ const d=new Date(w.start); if(d>=ws && w.pk!=="RH") set.add(dayOf(w)); });
  return set;
}

function protCard(){
  const items=S.prot[dkey()]||[], g=items.reduce((a,x)=>a+x[1],0), pct=Math.min(100,g/PROT_GOAL*100);
  return `<h2>חלבון היום</h2><div class="card stack">
    <div class="row between"><b class="num" style="font-size:22px">${g} <span class="muted" style="font-size:15px">/ ${PROT_GOAL} ג׳</span></b>${items.length?`<button class="btn sm ghost" data-act="pundo">בטל אחרון</button>`:""}</div>
    <div class="track" style="height:10px"><span class="fill" style="width:${pct}%;${g>=PROT_GOAL?"background:var(--good)":""}"></span></div>
    <div class="chips">${FOODS.map(([n,v],i)=>`<button class="chip" data-act="padd" data-i="${i}">${esc(n)} <span class="num muted">+${v}</span></button>`).join("")}</div>
    ${items.length?`<div class="muted" style="font-size:13px">${items.map(x=>esc(x[0])).join(" · ")}</div>`:""}</div>`;
}

function viewToday(){
  const t=todayIdx(), d=PLAN[S.day], done=weekDoneDays();
  const todayStr=new Date().toDateString();
  const week = PLAN.map((p,i)=>`<button class="wd ${i===t?"today":""} ${done.has(i)?"done":""} ${p.rest?"rest":""}" data-act="day" data-i="${i}" aria-pressed="${i===S.day}"><span class="l">${p.s}׳</span><span style="font-size:11px">${p.rest?"מנוחה":esc(p.title.split(" ")[0])}</span><span class="s"></span></button>`).join("");
  let html = `<h1>${S.day===t?"היום: ":"יום "+d.d+": "}${esc(d.title)}${rehabPhase()&&!d.rest?` <span class="pill down" style="font-size:13px;vertical-align:middle">שיקום · שלב ${rehabPhase()}</span>`:""}</h1><p class="sub">${esc(d.sub)} · ${new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"})}</p><div class="week">${week}</div><p class="muted" style="font-size:13px;margin:6px 2px 0">מתאמן היום אימון של יום אחר? הקש על היום ברצועה והתחל. זה נרשם כהחלפת יום.</p>`;

  if(S.active){
    const a=S.active, sets=a.items.reduce((n,x)=>n+x.sets.length,0);
    html += `<div class="card stack" style="margin-top:16px;border-color:var(--accent)"><div class="row between"><b>אימון פתוח: ${esc(a.pk==="RH"?"שיקום כתף":PLAN[dayOf(a)].title)}</b><span class="pill num">${sets} סטים</span></div><button class="btn primary big" data-act="resume">המשך אימון</button></div>`;
  }

  if(S.day===t) html += protCard();
  html += rehabCard(d);
  if(d.rest){
    html += `<h2>היום</h2><div class="card">${(d.list||[]).map((x,i)=>{const k="r"+S.day+"_"+i;const on=S.warm.date===todayStr&&S.warm.done.includes(k);return `<button class="check" role="checkbox" aria-checked="${on}" data-act="chk" data-k="${k}"><span class="box">${on?"✓":""}</span><span>${esc(x)}</span></button>`}).join("")}</div>`;
    if(d.ex.length) html += `<h2>תרגילים קלים</h2><div class="stack">${d.ex.map(exRow).join("")}</div>${S.active?"":`<div style="margin-top:12px"><button class="btn" style="width:100%" data-act="start">התחל סשן התאוששות</button></div>`}`;
    return html;
  }

  // shoulder check
  const lv = S.shoulder.date===todayStr ? S.shoulder.level : null;
  html += `<h2>כתף ימין היום</h2><div class="card shoulder stack"><div class="chips">${[["0","בסדר"],["1","מאותתת"],["2","כואב"]].map(([v,l])=>`<button class="chip" data-act="sh" data-v="${v}" aria-pressed="${lv===+v}">${l}</button>`).join("")}</div>
    ${lv===2?`<div class="banner">התאמתי את האימון: תרגילים מעל הראש הוחלפו, לחיצות ב־15% פחות ובאחיזה נייטרלית. כאב חד או שנמשך מעל שבועיים: כדאי פיזיותרפיסט.</div>`:lv===1?`<div class="banner">מצב זהירות: שכיבות יהלום ומוגבהות הוחלפו ברגילות, לחיצות באחיזה נייטרלית ומרפקים 45°, הרחקות עד גובה הכתף. המשקלים לא יורדים. אם מופיע כאב באמצע סט, סמן "כואב".</div>`:""}</div>`;

  // warmup
  const wl=(WARM[d.warm]||[]).filter(x=> rehabPhase()!==1 || !/לחיצה קלה|פרפר גומייה/.test(x));
  const wdone = S.warm.date===todayStr ? S.warm.done : [];
  html += `<h2>חימום · 2:30</h2><div class="card">${wl.map((x,i)=>{const k="w"+S.day+"_"+i, on=wdone.includes(k);return `<button class="check" role="checkbox" aria-checked="${on}" data-act="chk" data-k="${k}"><span class="box">${on?"✓":""}</span><span>${esc(x)}</span></button>`}).join("")}</div>`;

  const exl=dayEx(d);
  html += `<h2>תרגילים · ${exl.length}</h2><div class="stack">${exl.map(exRow).join("")}</div>`;
  if(!S.active){
    const swap = S.day!==t;
    html += `<div style="margin-top:16px" class="stack">${swap?`<div class="banner">החלפת יום: האימון של יום ${d.d} יירשם כבוצע היום (${DAYN[t]}), ויסומן ✓ על יום ${d.d} ברצועה.</div>`:""}<button class="btn primary big" style="width:100%" data-act="start">${swap?`התחל את אימון ${d.d} היום`:"התחל אימון"}</button></div>`;
  }
  return html;
}

  S.history.forEach(w=>{ if(new Date(w.start)>=ws) w.items.forEach(it=>{const g=EX[it.id].grp; done[g]=(done[g]||0)+it.sets.length;}); });
  const max=24;
  const bars = Object.keys(GRP).map(g=>{const [lo,hi]=GRP_TARGET[g], v=done[g]||0, pl=planned[g]||0;
    return `<div class="bar"><span>${GRP[g]}</span><div class="track"><span class="zone" style="inset-inline-start:${lo/max*100}%;width:${(hi-lo)/max*100}%"></span><span class="fill plan" style="width:${Math.min(pl,max)/max*100}%"></span><span class="fill" style="width:${Math.min(v,max)/max*100}%"></span></div><span class="num muted" style="text-align:left">${v}/${pl}</span></div>`}).join("");

  const tot=S.history.length, wk=S.history.filter(w=>new Date(w.start)>=ws).length;

  html += `<h2>היסטוריה</h2><div class="hist">${S.history.length?S.history.slice().reverse().slice(0,30).map(w=>{
      const n=w.items.reduce((a,i)=>a+i.sets.length,0), min=w.end?Math.round((new Date(w.end)-new Date(w.start))/60000):0, open=S.openHist===w.id;

      ${open?`<div class="hdet">${w.items.filter(i=>i.sets.length).map(i=>`<div class="row between"><span>${esc(EX[i.id].heb)}</span><span class="num">${i.sets.map(s=>(s.kg?fmtKg(s.kg)+"×":"")+s.reps).join("  ")}</span></div>`).join("")}${w.shoulder>=1?`<div>כתף: ${w.shoulder===2?"כואבת":"מאותתת"}</div>`:""}
        ${S.confirmDel===w.id?`<div class="confirm"><button class="btn sm danger" data-act="delyes" data-id="${w.id}">מחק לצמיתות</button><button class="btn sm" data-act="delno">ביטול</button></div>`:`<div class="confirm"><button class="btn sm ghost danger" data-act="del" data-id="${w.id}">מחק אימון</button></div>`}</div>`:""}</div>`}).join(""):`<div class="card muted">עוד אין אימונים שמורים. כל סט שתסמן נשמר מיד.</div>`}</div>

function drawLine(cv,pts,fmt){
  if(!cv) return; const cs=getComputedStyle(document.documentElement);
  const acc=cs.getPropertyValue("--accent").trim(), mut=cs.getPropertyValue("--muted").trim(), line=cs.getPropertyValue("--line").trim();
  const dpr=devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr;
  const c=cv.getContext("2d"); c.scale(dpr,dpr); c.clearRect(0,0,W,H);
  if(pts.length<2){ c.fillStyle=mut; c.font="14px Assistant, sans-serif"; c.textAlign="center"; c.fillText(pts.length?"עוד אימון אחד והגרף יתחיל":"אין נתונים עדיין",W/2,H/2); return; }
  const ys=pts.map(p=>p.y), lo=Math.min(...ys), hi=Math.max(...ys), pad=(hi-lo)*0.15||1, y0=lo-pad, y1=hi+pad;
  const L=8,R=40,T=10,B=22, X=i=>L+(W-L-R)*(i/(pts.length-1)), Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  c.strokeStyle=line; c.lineWidth=1; c.fillStyle=mut; c.font="11px 'IBM Plex Mono', monospace"; c.textAlign="left";
  [lo,(lo+hi)/2,hi].forEach(v=>{c.beginPath();c.moveTo(L,Y(v));c.lineTo(W-R,Y(v));c.stroke();c.fillText(fmt(v),W-R+4,Y(v)+4);});
  c.textAlign="center"; [0,pts.length-1].forEach(i=>c.fillText(pts[i].x,X(i),H-6));
  const g=c.createLinearGradient(0,T,0,H-B); g.addColorStop(0,acc+"55"); g.addColorStop(1,acc+"00");
  c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.y)):c.moveTo(X(i),Y(p.y))); c.lineTo(X(pts.length-1),H-B); c.lineTo(X(0),H-B); c.closePath(); c.fillStyle=g; c.fill();
  c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.y)):c.moveTo(X(i),Y(p.y))); c.strokeStyle=acc; c.lineWidth=2.4; c.lineJoin="round"; c.stroke();
  const li=pts.length-1; c.beginPath(); c.arc(X(li),Y(pts[li].y),5,0,7); c.fillStyle=acc; c.fill();
}
function drawCharts(){
  const sess=lastSessions(S.progEx,10).reverse();
  drawLine($("#exChart"), sess.map(s=>({x:dstr(s.date),y:Math.max(...s.sets.map(e1rm))})), v=>v.toFixed(EX[S.progEx]?.type==="db"?1:0));
  const m=S.bodyM; drawLine($("#bwChart"), S.body.filter(b=>b[m]!=null).slice(-20).map(b=>({x:dstr(b.d),y:b[m]})), v=>v.toFixed(1));
}

/* ---------- Workout mode ---------- */
function startWorkout(){
  const d=PLAN[S.day], now=new Date().toISOString();
  S.active={id:"w_"+now.replace(/[^0-9]/g,"").slice(0,14),status:"active",start:now,day:S.day,pk:S.rehabOnly?"RH":d.k,swapFrom:S.day!==todayIdx()?todayIdx():null,shoulder:S.shoulder.date===new Date().toDateString()?S.shoulder.level:null,
    cur:0,items:(S.rehabOnly?REHAB[rehabPhase()].block:dayEx(d)).map(p=>{const id=resolveEx(p.id);return {id,plan:p,sets:[]};})};
  S.rehabOnly=false; primeDraft(); saveWorkout(S.active); askWake(); render();
}
function cur(){ return S.active.items[S.active.cur]; }
function primeDraft(){
  const it=cur(); if(!it) return; const r=recommend(it.id,it.plan), last=it.sets.at(-1);
  S.active.draft = last ? {kg:last.kg,band:last.band,reps:last.reps,rir:null} : {kg:r.kg,band:r.band,reps:r.reps,rir:null};
}
function renderWorkout(){
  const el=$("#wk");
  if(!S.active){ el.hidden=true; return; }
  if(!S.active.open){ el.hidden=true; return; }
  el.hidden=false;
  const a=S.active, it=cur(), ex=EX[it.id], p=it.plan, r=recommend(it.id,p), dr=a.draft||{};
  const prog=a.items.map((x,i)=>`<i class="${x.sets.length>=x.plan.sets?"d":i===a.cur?"c":""}"></i>`).join("");
  const hero = ex.img ? `<div class="hero"><img src="${IMG[ex.img]}" alt=""><button class="how" data-act="how" data-id="${it.id}">איך מבצעים?</button><div class="ov"><h3>${esc(ex.heb)}</h3><div style="opacity:.85;font-size:14px">${esc(ex.en)}</div></div></div>`
    : `<div class="hero noimg"><button class="how" data-act="how" data-id="${it.id}">איך מבצעים?</button><div class="ov"><h3>${esc(ex.heb)}</h3><div class="muted" style="font-size:14px">${esc(ex.en)}</div></div></div>`;
  const loadCtl = ex.type==="db"
    ? `<div class="stp"><label for="kgIn">ק״ג ${ex.dbOne?"(משקולת אחת)":"ליד"}</label><div class="ctl" dir="ltr"><button data-act="kg" data-d="-1" aria-label="משקולת קלה יותר">−</button><input id="kgIn" class="num" inputmode="decimal" value="${fmtKg(dr.kg||0)}"><button data-act="kg" data-d="1" aria-label="משקולת כבדה יותר">+</button></div></div>`
    : ex.type==="band" ? `<div class="stp"><label>גומייה</label><div class="bands" style="margin-top:6px">${BANDS.map(b=>`<button class="chip" style="justify-content:center;font-size:13px;padding:4px" data-act="band" data-b="${esc(b)}" aria-pressed="${dr.band===b}">${esc(b)}</button>`).join("")}</div></div>`
    : `<div class="stp" style="display:grid;place-items:center;text-align:center"><label>משקל גוף</label><div class="muted" style="font-size:14px">יעד ${p.lo}–${p.hi} ${unitOf(ex)}</div></div>`;
  const step = ex.type==="time"?5:1;
  const repsCtl = `<div class="stp"><label for="repIn">${ex.type==="time"?"שניות":"חזרות"}${ex.perSide?" לצד":""}</label><div class="ctl" dir="ltr"><button data-act="reps" data-d="-${step}" aria-label="פחות">−</button><input id="repIn" class="num" inputmode="numeric" value="${dr.reps||0}"><button data-act="reps" data-d="${step}" aria-label="יותר">+</button></div></div>`;
  const setsHtml = Array.from({length:Math.max(p.sets,it.sets.length)},(_,i)=>{const s=it.sets[i];
    return s ? `<div class="set"><span class="n">${i+1}</span><span class="num">${s.kg?fmtKg(s.kg)+" ק״ג × ":s.band?esc(s.band)+" × ":""}${s.reps}${s.rir!=null?` <span class="muted">· רזרבה ${s.rir===3?"3+":s.rir}</span>`:""}</span><span></span><button class="x" data-act="unset" data-i="${i}" aria-label="מחק סט">×</button></div>`
      : `<div class="set todo"><span class="n">${i+1}</span><span>${i===it.sets.length?"הסט הבא":"—"}</span><span></span><span></span></div>`}).join("");
  const doneEx = it.sets.length>=p.sets, last=a.cur===a.items.length-1;
  const alt = ex.alt || (EX[it.plan.id]!==ex ? it.plan.id : null);
  el.innerHTML = `
  <div class="wk-top"><button class="btn sm ghost" data-act="minimize" aria-label="מזער">⌄</button><div class="wk-prog">${prog}</div><span class="num muted" style="font-size:14px">${a.cur+1}/${a.items.length}</span></div>
  <div class="wk-body">
    ${hero}
    <div class="target"><div><small>יעד</small><b>${p.sets}×${p.lo}–${p.hi}</b></div><div><small>פעם קודמת</small><b>${lastSummary(it.id)}</b></div><div><small>מנוחה</small><b>${p.rest} ש׳</b></div></div>
    <p class="why">${r.why}</p>
    ${a.shoulder>=1&&ex.risky&&ex.shoulder?`<div class="banner" style="margin-top:8px">${esc(ex.shoulder)}</div>`:""}
    <div class="steppers">${loadCtl}${repsCtl}</div>
    <div class="rir"><div class="muted" style="font-size:13px;margin-bottom:6px">כמה חזרות נשארו ברזרבה? (לא חובה)</div><div class="chips">${[0,1,2,3].map(v=>`<button class="chip" data-act="rir" data-v="${v}" aria-pressed="${dr.rir===v}">${v===3?"3+":v}</button>`).join("")}</div></div>
    <div class="sets">${setsHtml}</div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap">
      ${a.cur>0?`<button class="btn sm" data-act="prev">→ הקודם</button>`:""}
      ${!last?`<button class="btn sm" data-act="next">דלג לבא ←</button>`:""}
      ${alt?`<button class="btn sm" data-act="swap" data-id="${alt}">החלף ל${esc(EX[alt].heb)}</button>`:""}
      <button class="btn sm ghost" data-act="finish">סיים אימון</button>
    </div>
  </div>
  <div class="wk-foot"><div class="in">
    ${doneEx ? `<div class="row"><button class="btn" style="flex:1" data-act="logset">+ סט נוסף</button><button class="btn primary big" style="flex:2" data-act="${last?"finish":"next"}">${last?"סיום ושמירה":"לתרגיל הבא ←"}</button></div>`
             : `<button class="btn primary big" data-act="logset">✓ סיימתי סט ${it.sets.length+1}</button>`}
  </div></div>`;
}
function logSet(){
  const it=cur(), ex=EX[it.id], dr=S.active.draft;
  readInputs();
  if(!dr.reps||dr.reps<1){ toast("הזן מספר חזרות"); return; }
  const s={reps:+dr.reps,t:new Date().toISOString()};
  if(ex.type==="db") s.kg=+dr.kg; if(ex.type==="band") s.band=dr.band; if(dr.rir!=null) s.rir=dr.rir;
  it.sets.push(s); S.active.draft={...dr,rir:null};
  saveWorkout(S.active);
  const pr = lastSessions(it.id,20).length && e1rm(s) > Math.max(...lastSessions(it.id,20).flatMap(x=>x.sets.map(e1rm)));
  if(pr) toast("שיא אישי חדש! "+(s.kg?`${fmtKg(s.kg)}×${s.reps}`:s.reps));
  const exDone = it.sets.length>=it.plan.sets, isLast=S.active.cur===S.active.items.length-1;
  if(exDone && isLast){ renderWorkout(); return; }
  const nextName = exDone ? EX[S.active.items[S.active.cur+1].id].heb : `${ex.heb} · סט ${it.sets.length+1}`;
  startRest(exDone?Math.max(it.plan.rest,90):it.plan.rest, nextName);
  if(exDone){ S.active.cur++; primeDraft(); }
  renderWorkout();
}
function readInputs(){
  const dr=S.active.draft, k=$("#kgIn"), r=$("#repIn");
  if(k){ const v=parseFloat(k.value); if(!isNaN(v)) dr.kg=Math.max(0,Math.min(48,v)); }
  if(r){ const v=parseInt(r.value); if(!isNaN(v)) dr.reps=Math.max(0,v); }
}
function finishWorkout(){
  const a=S.active; delete a.draft; delete a.open; a.status="done"; a.end=new Date().toISOString();
  a.items=a.items.filter(i=>i.sets.length);
  if(!a.items.length){ S.active=null; deleteWorkout(a.id); render(); toast("האימון בוטל, לא נרשמו סטים"); return; }
  S.history.push(a); S.active=null; saveWorkout(a); releaseWake();
  const n=a.items.reduce((x,i)=>x+i.sets.length,0), vol=a.items.reduce((x,i)=>x+i.sets.reduce((y,s)=>y+(s.kg||0)*s.reps,0),0);
  const min=Math.round((new Date(a.end)-new Date(a.start))/60000);
  stopRest(); render(); toast(`נשמר: ${n} סטים · ${min} דק׳ · ${Math.round(vol)} ק״ג נפח`,4000);
}

/* ---------- Rest timer ---------- */
let audio=null;
function beep(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach((d,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.25,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.2);o.connect(g).connect(audio.destination);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.22);}); }catch{} }
function startRest(sec,next){ rest={end:Date.now()+sec*1000,total:sec,next}; tickRest(); clearInterval(startRest.h); startRest.h=setInterval(tickRest,250); }
function stopRest(){ rest=null; clearInterval(startRest.h); $("#rest").hidden=true; }
function tickRest(){
  const el=$("#rest"); if(!rest){ el.hidden=true; return; }
  const left=Math.max(0,Math.ceil((rest.end-Date.now())/1000));
  if(left<=0){ beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch{} stopRest(); toast("יאללה, סט הבא"); return; }
  const C=2*Math.PI*45, frac=left/rest.total;
  el.hidden=false;
  el.innerHTML=`<div class="muted" style="letter-spacing:.08em;font-weight:700">מנוחה</div>
   <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--line)" stroke-width="6"/><circle class="p" cx="50" cy="50" r="45" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg><div class="t">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</div></div>
   <div class="rest-next"><span class="muted">הבא</span><b>${esc(rest.next)}</b></div>
   <div class="rest-actions"><button class="btn" data-act="rest" data-d="-15">−15</button><button class="btn" data-act="rest" data-d="15">+15</button><button class="btn primary" data-act="skiprest">דלג</button></div>`;
}

/* ---------- Wake lock ---------- */
async function askWake(){ try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch{} }
function releaseWake(){ try{ wakeLock&&wakeLock.release(); }catch{} wakeLock=null; }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.active?.open) askWake(); if(rest) tickRest(); });

/* ---------- How-to sheet ---------- */
function openHow(id){
  const ex=EX[id], el=$("#sheet");
  el.innerHTML=`<div class="pane" role="dialog" aria-label="${esc(ex.heb)}"><div class="grab"></div>
    ${ex.img?`<img src="${IMG[ex.img]}" alt="${esc(ex.heb)}">`:""}
    <h3>${esc(ex.heb)}</h3><div class="muted">${esc(ex.en)} · ${GRP[ex.grp]}</div>
    <div class="k">ביצוע</div><ul>${ex.cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    <div class="k">טעויות נפוצות</div><ul>${ex.errs.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    ${ex.shoulder?`<div class="k">כתף רגישה</div><p style="margin:6px 0">${esc(ex.shoulder)}</p>`:""}
    <div class="row" style="margin-top:14px"><a class="btn" style="flex:1;text-decoration:none" href="${ex.vid}" target="_blank" rel="noopener">▶ סרטון הדגמה</a><button class="btn primary" style="flex:1" data-act="closesheet">סגור</button></div></div>`;
  el.hidden=false;
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-tab]");
  if(e.target.id==="sheet"){ $("#sheet").hidden=true; return; }
  if(!b) return;
  if(b.dataset.tab){ S.tab=b.dataset.tab; if(S.tab==="today") S.day=todayIdx(); render(); scrollTo(0,0); return; }
  const act=b.dataset.act, A=S.active;
  switch(act){
    case "day": S.day=+b.dataset.i; render(); break;
    case "goday": S.day=+b.dataset.i; S.tab="today"; render(); scrollTo(0,0); break;
    case "sh": S.shoulder={date:new Date().toDateString(),level:+b.dataset.v}; lsSet("nf.shoulder",S.shoulder); render(); break;
    case "chk": { const td=new Date().toDateString(); if(S.warm.date!==td) S.warm={date:td,done:[]}; const k=b.dataset.k, i=S.warm.done.indexOf(k); i<0?S.warm.done.push(k):S.warm.done.splice(i,1); lsSet("nf.warm",S.warm); render(); break; }
    case "start": startWorkout(); S.active.open=true; render(); break;
    case "rehabgo": S.rehabOnly=true; startWorkout(); S.active.open=true; render(); break;
    case "rehab": { const v=+b.dataset.v; if(v!==rehabPhase()) S.rehab={phase:v,since:new Date().toISOString().slice(0,10)}; lsSet("nf.rehab",S.rehab); put("rehab",S.rehab); render(); break; }
    case "resume": S.active.open=true; if(!S.active.draft) primeDraft(); askWake(); render(); break;
    case "minimize": readInputs(); A.open=false; persistLocal(); render(); break;
    case "how": openHow(b.dataset.id); break;
    case "closesheet": $("#sheet").hidden=true; break;
    case "kg": readInputs(); { const cur=+A.draft.kg||0, d=+b.dataset.d; const sn=snapKg(cur); A.draft.kg = cur===0&&d>0 ? DBW[0] : (sn!==cur ? (d>0? (DBW.find(w=>w>cur)||MAXW) : ([...DBW].reverse().find(w=>w<cur)||DBW[0])) : stepKg(cur,d>0?1:-1)); } renderWorkout(); break;
    case "reps": readInputs(); A.draft.reps=Math.max(0,(+A.draft.reps||0)+ +b.dataset.d); renderWorkout(); break;
    case "band": A.draft.band=b.dataset.b; readInputs(); renderWorkout(); break;
    case "rir": readInputs(); A.draft.rir = A.draft.rir===+b.dataset.v?null:+b.dataset.v; renderWorkout(); break;
    case "logset": logSet(); break;
    case "unset": cur().sets.splice(+b.dataset.i,1); saveWorkout(A); renderWorkout(); break;
    case "next": readInputs(); if(A.cur<A.items.length-1){A.cur++; primeDraft(); stopRest(); saveWorkout(A); renderWorkout(); $(".wk-body").scrollTop=0;} break;
    case "prev": readInputs(); if(A.cur>0){A.cur--; primeDraft(); renderWorkout();} break;
    case "swap": { const it=cur(); it.id=b.dataset.id; it.sets=[]; primeDraft(); saveWorkout(A); renderWorkout(); break; }
    case "finish": readInputs(); finishWorkout(); break;
    case "rest": rest.end+= +b.dataset.d*1000; rest.total=Math.max(rest.total,(rest.end-Date.now())/1000); tickRest(); break;
    case "skiprest": stopRest(); break;
    case "padd": { const k=dkey(), fd=FOODS[+b.dataset.i]; (S.prot[k]=S.prot[k]||[]).push([fd[0],fd[1]]); saveProt(); render(); break; }
    case "pundo": { const k=dkey(); (S.prot[k]||[]).pop(); saveProt(); render(); break; }
    case "bm": S.bodyM=b.dataset.k; render(); break;
    case "pex": S.progEx=b.dataset.id; render(); break;
    case "hist": S.openHist = S.openHist===b.dataset.id?null:b.dataset.id; S.confirmDel=null; render(); break;
    case "del": S.confirmDel=b.dataset.id; render(); break;
    case "delno": S.confirmDel=null; render(); break;
    case "delyes": S.history=S.history.filter(w=>w.id!==b.dataset.id); deleteWorkout(b.dataset.id); S.confirmDel=null; render(); toast("האימון נמחק"); break;
    case "bw": { const v=parseFloat($("#bwIn").value); if(!(v>30&&v<200)){toast("הזן משקל בק״ג");break;} const d=new Date().toISOString().slice(0,10); const bf=parseFloat($("#bfIn").value); const e={d,kg:v}; if(bf>3&&bf<60) e.fat=bf; S.body=S.body.filter(x=>x.d!==d).concat(e).sort((a,b)=>a.d.localeCompare(b.d)); saveBody(); render(); toast("משקל נשמר"); break; }
    case "export": { const txt=JSON.stringify({exported:new Date().toISOString(),history:S.history,body:S.body},null,1);
      navigator.clipboard?.writeText(txt).then(()=>toast("הועתק ללוח"),()=>toast("ההעתקה נחסמה")) ?? toast("ההעתקה לא נתמכת"); break; }
    case "lgGoogle": lgGoogle(); break;
    case "lgSend": lgSend(); break;
    case "lgVerify": lgVerify(); break;
    case "lgBack": showLogin(); break;
    case "lgSkip": lsSet("nf.skipLogin",true); $("#login").hidden=true; break;
    case "login": if(!store.user) showLogin(); break;
    case "logout": sb&&sb.auth.signOut().then(()=>{ store.user=null; store.pulled=false; setSync(); render(); toast("התנתקת. הנתונים נשארו במכשיר"); }); break;
    case "dl": { const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),history:S.history,body:S.body,protein:S.prot},null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="noam-fit-"+dkey()+".json"; document.body.appendChild(a); a.click(); a.remove(); break; }
    case "__old_dl": (async()=>{ try{ const d=await claude.use("downloads"); await d.save({filename:"noam-fit-"+new Date().toISOString().slice(0,10)+".json",data:JSON.stringify({history:S.history,body:S.body},null,1)}); }catch{ toast("ההורדה בוטלה"); } })(); break;
  }
});
document.addEventListener("change",e=>{ if(S.active && (e.target.id==="kgIn"||e.target.id==="repIn")) readInputs(); });

render();
initStore();

</script>

<script>if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
